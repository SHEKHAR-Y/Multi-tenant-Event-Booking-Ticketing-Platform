{% extends "base.html" %}

{% block title %}Log in – Marquee{% endblock %}
{% block tab_home %}{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <h1>Welcome back</h1>
        <p class="auth-sub">Log in to continue booking.</p>

        <div id="error-box" class="error-line" role="alert" style="display:none;"></div>

        <form id="login-form" class="form-block">
            <div class="field">
                <label for="username">Email</label>
                <input type="email" id="username" name="username" placeholder="you@example.com" autocomplete="username" required autofocus>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Log in</button>
        </form>

        <p class="auth-foot">New here? <a href="/register">Create an account</a></p>
    </div>
</div>

<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const errorBox = document.getElementById('error-box');
    const submitBtn = form.querySelector('button[type="submit"]');

    const body = new URLSearchParams();
    body.append('username', form.username.value);
    body.append('password', form.password.value);

    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in…';

    try {
        const res = await fetch('/api/v1/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: body,
            credentials: 'same-origin',   // lets the browser store the Set-Cookie response
        });

        if (res.ok) {
            window.location.href = '/';
            return;
        }

        const data = await res.json();
        let message = 'Invalid email or password.';
        if (data.error && Array.isArray(data.error) && data.error.length > 0) {
            message = data.error[0].msg || message;
        } else if (data.detail) {
            message = typeof data.detail === 'string' ? data.detail : message;
        }
        errorBox.textContent = message;
        errorBox.style.display = 'block';
    } catch (err) {
        errorBox.textContent = 'Network error. Check your connection and try again.';
        errorBox.style.display = 'block';
    } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log in';
    }
});
</script>
{% endblock %}
