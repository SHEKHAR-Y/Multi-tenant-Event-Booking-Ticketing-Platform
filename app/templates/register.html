{% extends "base.html" %}

{% block filename %}register.html{% endblock %}
{% block tab_home %}{% endblock %}

{% block content %}
<pre class="code-block"><span class="c">// auth.register()</span>
<span class="c">// create an account to book events</span>
</pre>

{% if error %}
<div id="error-box" class="error-line">// error: {{ error }}</div>
{% else %}
<div id="error-box" class="error-line" style="display:none;"></div>
{% endif %}

<form id="register-form" class="form-block">
    <div class="field">
        <label for="full_name">full_name</label>
        <input type="text" id="full_name" name="full_name" placeholder="Shekhar Y" required autofocus>
    </div>
    <div class="field">
        <label for="email">email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
    </div>
    <div class="field">
        <label for="password">password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required minlength="8">
    </div>
    <button type="submit" class="btn btn-primary">register()</button>
    <a href="/login" class="btn btn-ghost">login()</a>
</form>

<script>
document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const errorBox = document.getElementById('error-box');
    const submitBtn = form.querySelector('button[type="submit"]');

    const payload = {
        username: form.full_name.value,
        email: form.email.value,
        password: form.password.value,
    };

    submitBtn.disabled = true;
    submitBtn.textContent = 'registering...';

    try {
        const res = await fetch('/api/v1/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
        });

        if (res.status === 201) {
            window.location.href = '/login';
            return;
        }

        const data = await res.json();
        let message = 'registration failed';
        if (data.error && Array.isArray(data.error) && data.error.length > 0) {
            message = data.error[0].msg || message;
        } else if (data.detail) {
            message = typeof data.detail === 'string' ? data.detail : message;
        }
        errorBox.textContent = '// error: ' + message;
        errorBox.style.display = 'block';
    } catch (err) {
        errorBox.textContent = '// error: network error, please try again';
        errorBox.style.display = 'block';
    } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'register()';
    }
});
</script>
{% endblock %}
