name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # use the secrets from github actions secret and variables
    env:
      DEBUG: ${{secrets.DEBUG}}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_URL: ${{secrets.REDIS_URL}}
      SECRET_KEY: ${{secrets.SECRET_KEY}}
      access_token_expire_minutes: ${{secrets.ACCESS_TOKEN_EXPIRE_MINUTES}}
      refresh_token_expire_days: ${{secrets.REFRESH_TOKEN_EXPIRE_DAYS}}
      algo: ${{secrets.ALGO}}


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        
      - name: start redis for rate limiting (for test)
        run: docker compose up -d redis

      - name: Wait for Redis
        run: |
          until [ "$(docker inspect -f '{{.State.Health.Status}}' event-booking-redis)" = "healthy" ]; do
            echo "Waiting for Redis..."
            sleep 2
          done

      - name: Run tests
        run: pytest 

      - name: destroy the redis container
        if: always()
        run: docker compose down 